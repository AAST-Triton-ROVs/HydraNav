[project]
name = "hydranav"
version = "0.1.0"
description = "Ground Control Station Software from Triton ROVs control software subteam."
authors = [{ name = "jsyph", email = "youlof123@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "jsonschema (>=4.23.0,<5.0.0)",
    "mavproxy (>=1.8.71,<2.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "platformdirs (>=4.3.7,<5.0.0)",
    "numpy (>=2.2.4,<3.0.0)",
    "mypy (>=1.15.0,<2.0.0)",
    "types-pyyaml (>=6.0.12.20250326,<7.0.0.0)",
    "types-jsonschema (>=4.23.0.20241208,<5.0.0.0)",
    "pynput (>=1.8.1,<2.0.0)",
    "dimits (>=0.0.31a0,<0.0.32)",
    "xxhash (>=3.5.0,<4.0.0)",
    "from-root (>=1.3.0,<2.0.0)",
    "colorlog (>=6.9.0,<7.0.0)",
    "playsound3 (>=3.2.3,<4.0.0)",
    "nicegui (>=2.17.0,<3.0.0)",
    "pyglet (>=2.1.6,<3.0.0)",
    "netifaces (>=0.11.0,<0.12.0)",
    "opencv-python (>=4.11.0.86,<5.0.0.0)",
]

[[tool.mypy.overrides]]
module = ["untyped_package.*"]
follow_untyped_imports = true
ignore_missing_imports = true


[tool.poetry.group.dev.dependencies]
types-pynput = "^1.8.1.20250318"
types-netifaces = "^0.11.0.20241025"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
